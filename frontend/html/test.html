<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Sidebar panel */
        .sidebar {
        width: 240px;
        height: 100vh;
        background-color: #1e1e2f;
        padding-top: 20px;
        font-family: sans-serif;
        }

        /* Sidebar links & dropdown button */
        .sidebar a, 
        .dropdown-btn {
        padding: 12px 18px;
        text-decoration: none;
        font-size: 16px;
        color: #c2c2d6;
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        background: none;
        border: none;
        text-align: left;
        cursor: pointer;
        box-sizing: border-box;
        transition: background 0.2s, color 0.2s;
        }

        /* Hover effects */
        .sidebar a:hover, 
        .dropdown-btn:hover {
        color: #ffffff;
        background-color: #2a2a40;
        }

        /* Hide dropdown contents by default */
        .dropdown-container {
        display: none;
        background-color: #141420;
        }

        .dropdown-container a {
        padding-left: 32px; /* Indent sub-items */
        font-size: 14px;
        }

        /* Shown when active class is toggled */
        .dropdown-container.show {
        display: block;
        }

        /* Optional arrow rotation */
        .dropdown-btn.active .arrow {
        transform: rotate(180deg);
}
    </style>
</head>
<body>
    <div class="sidebar">
  <a href="#home">Home</a>

  <!-- Dropdown Menu -->
  <div class="dropdown">
    <button class="dropdown-btn">
      Services <span class="arrow">▼</span>
    </button>
    <div class="dropdown-container">
      <a href="#web">Web Design</a>
      <a href="#dev">Development</a>
      <a href="#seo">SEO</a>
    </div>
  </div>

  <a href="#contact">Contact</a>
</div>
<script>
    const dropdownBtn = document.querySelector('.dropdown-btn');
    const dropdownContainer = document.querySelector('.dropdown-container');

    dropdownBtn.addEventListener('click', () => {
    // Toggle visibility of the child items
    dropdownContainer.classList.toggle('show');
    
    // Toggle active class on button (useful for arrow animation)
    dropdownBtn.classList.toggle('active');
});
</script>
</body>
</html>

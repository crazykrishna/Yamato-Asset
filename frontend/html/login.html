<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamato Assets Management System</title>
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body>
    <div id="logo">
        <video autoplay loop muted playsinline>
            <source src="/frontend/videos/global-network.mp4" type="video/mp4">
        </video>
        <img src="/frontend/images/banner-logo.png" alt="logo">
        <div id="main">
            <div id="main2">
                <br>
                    <h2>Asset Management System</h2><br>
                    <h3>Sign In</h3><br>
                <form id="login-form" >
                    <label for="username">Username</label><br>
                    <input type="text" id="username"><br>
                    <label for="password">Password</label><br>
                    <input type="password" name="password" id="password"><br>
                    <button id="log-in" type="submit">Log In</button>
                    <br>
                </form>
            </div>
        </div>
    </div>
    <script src="/frontend/java/login.js"></script>
</body>
</html>

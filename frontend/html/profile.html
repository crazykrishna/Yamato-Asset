<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assets Management Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/frontend/css/profile.css">
</head>
<body>
    <header>
        <div id="start">
            <img src="/frontend/images/logo-Photoroom.png" alt="yamatoo">
        </div>
        <div id="contentbar">
            <button id="home"><i class="ri-home-5-line"></i> HOME</button>
            <button id="assets-list"><i class="ri-file-list-3-line"></i> ASSETS LIST</button>
            <button id="inventory"><i class="ri-folder-chart-line"></i> INVENTORY</button>
            <button id="reports"><i class="ri-dossier-line"></i> REPORTS</button>
        </div>
        <div id="profile">
            <i id="i" class="ri-user-2-line"></i>
            <button id="log-out">Log Out</button>
        </div>
    </header>

    <div id="parent">
        <div id="sidebar">
            <button id="find"><i class="ri-search-line"></i> <span>Find</span></button>
            <button id="assests-list"><i class="ri-file-list-3-line"></i> <span>Assets list</span></button>
            <button id="Register-Asset"><i class="ri-registered-line"></i> <span>Register Asset</span></button>
            <button id="Register-New-User"><i class="ri-user-add-line"></i> <span>Register New User</span></button>
            <button id="profilee"><i id="i" class="ri-user-2-line"></i> <span>Profile</span></button>
        </div>
        
        <div id="content">
            <h1>Hello, Admin</h1>
            <div id="parent-2">
                <div id="profileee">
                    <h1>Profile</h1>
                    <div id="test">
                        <img src="/frontend/images/profile_logo-removebg-preview.png" alt="">
                        <div id="credentials">
                            <label for="username">Username</label>
                            <input type="text" disabled><br>
                            <label for="password">Password</label>
                            <input type="password" disabled><br>
                            <button id="change">Reset</button>
                        </div>
                    </div>
                </div>

                <div id="uploads">
                    <h2>Upload Your Data Here</h2>
                    <div id="files">
                        <div class="roww">
                            <h3>Assets Lists</h3>
                            <input type="file" name="excel" id="excelfile-assets"/>
                            <button id="uploadbtn-assets">Upload</button>
                        </div>
                        <div class="roww">
                            <h3>Inventory</h3>
                            <input type="file" name="excel" id="excelfile-inventory"/>
                            <button id="uploadbtn-inventory">Upload</button>
                        </div>
                        <div class="roww">
                            <h3>Employee</h3>
                            <input type="file" name="excel" id="excelfile-employee"/>
                            <button id="uploadbtn-employee">Upload</button>
                        </div>
                        <p id="uploadstatus"></p>
                    </div>
                </div>
            </div>

            <div id="list">
                <h1>View Employee Reports</h1>
                <div id="details">
                    <div id="all">
                        <div id="sub-1"><i class="ri-file-list-2-line"></i> Krishna Soni</div>
                        <div class="sub">
                            <button class="special">View</button>
                            <button class="svg">Edit</button>
                        </div>
                    </div>
                </div>
            </div>

            <div style="margin-top: 20px; overflow-x: auto;">
                <table id="assetGrid" style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead id="gridHeader"></thead>
                    <tbody id="gridBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="/frontend/java/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics - Asset Management Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/frontend/css/reports.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <header>
        <div id="start">
            <img src="/frontend/images/logo-Photoroom.png" alt="yamatoo">
        </div>
        <div id="contentbar">
            <button id="home"><i class="ri-home-5-line"></i> HOME</button>
            <button id="assets-list"><i class="ri-file-list-3-line"></i> ASSETS LIST</button>
            <button id="inventory"><i class="ri-folder-chart-line"></i> INVENTORY</button>
            <button id="reports"><i class="ri-dossier-line"></i> REPORTS</button>
        </div>
        <div id="profile">
            <i id="i" class="ri-user-2-line"></i>
            <button id="log-out">Log Out</button>
        </div>
    </header>

    <div id="parent">
        <div id="sidebar">
            <button id="find"><i class="ri-search-line"></i> <span>Find</span></button>
            <button id="assests-list"><i class="ri-file-list-3-line"></i> <span>Assets list</span></button>
            <button id="Register-Asset"><i class="ri-registered-line"></i> <span>Register Asset</span></button>
            <button id="Register-New-User"><i class="ri-user-add-line"></i> <span>Register New User</span></button>
            <button id="profilee"><i class="ri-user-2-line"></i> <span>Profile</span></button>
        </div>

        <div id="content">
            <h1>System Reports &amp; Analytics</h1>

            <!-- Top row: chart + total value -->
            <div id="parent-1">
                <div id="graph">
                    <div id="titlee">
                        <h4>Asset Depreciation (This Year)</h4>
                        <div id="seelect">
                            <select id="generate-report-dd">
                                <option value="1year">This Year</option>
                                <option value="5year">Last 5 Years</option>
                            </select>
                        </div>
                    </div>
                    <div id="main-graph">
                        <canvas id="depreciationChart"></canvas>
                    </div>
                </div>

                <div id="value">
                    <h4>Total Inventory Value</h4>
                    <div id="paisa">
                        <h1 id="total-value-display">Loading...</h1>
                    </div>
                </div>
            </div>

            <!-- Report templates list -->
            <div id="parent-2">
                <h4>Available Report Templates</h4>

                <div class="list-row">
                    <div class="list-label">
                        <i class="ri-file-list-2-line"></i> Asset Audit Trail
                    </div>
                    <div class="sub">
                        <button class="special" data-report="audit-trail">Generate Report</button>
                        <button class="svg" data-report="audit-trail">Convert To SVG</button>
                    </div>
                </div>

                <div class="list-row">
                    <div class="list-label">
                        <i class="ri-file-list-2-line"></i> Maintenance Schedule
                    </div>
                    <div class="sub">
                        <button class="special" data-report="maintenance">Generate Report</button>
                        <button class="svg" data-report="maintenance">Convert To SVG</button>
                    </div>
                </div>

                <div class="list-row">
                    <div class="list-label">
                        <i class="ri-file-list-2-line"></i> User Activity Log
                    </div>
                    <div class="sub">
                        <button class="special" data-report="user-activity">Generate Report</button>
                        <button class="svg" data-report="user-activity">Convert To SVG</button>
                    </div>
                </div>

                <div class="list-row">
                    <div class="list-label">
                        <i class="ri-file-list-2-line"></i> Check-out History
                    </div>
                    <div class="sub">
                        <button class="special" data-report="checkout-history">Generate Report</button>
                        <button class="svg" data-report="checkout-history">Convert To SVG</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="/frontend/java/reports.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Test</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
        html, body { height:100%; background:#222; display:flex; }

        #sidebar {
            height: 100%;
            width: 80px;
            display: flex;
            background-color: #171717;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 10px;
            padding: 10px 5px;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            transition: width 0.3s ease;
            box-sizing: border-box;
        }
        #sidebar::-webkit-scrollbar { display: none; }
        #sidebar:hover { width: 220px; }

        /* ALL sidebar buttons */
        #sidebar button {
            cursor: pointer;
            border: none;
            background-color: transparent;
            color: white;
            width: 100%;
            height: 50px;
            border-radius: 10px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            padding: 0 15px;
            text-align: left;
            transition: background-color 0.2s;
        }
        #sidebar button i {
            font-size: 20px;
            min-width: 30px;
            display: flex;
            justify-content: center;
        }
        #sidebar button span {
            opacity: 0;
            margin-left: 10px;
            transition: opacity 0.2s ease;
            pointer-events: none;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #sidebar:hover button span { opacity: 1; }
        #sidebar button:hover { background-color: #f5cf04; color: black; }

        /* ── Software Dropdown ── */
        #software-dropdown-wrapper { width: 100%; flex-shrink: 0; }
        #software-toggle { width: 100%; }

        #software-arrow {
            font-size: 16px;
            min-width: unset !important;
            transition: transform 0.3s ease;
            display: inline-flex !important;
        }
        #software-arrow.rotated { transform: rotate(180deg); }

        #software-submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, border-color 0.35s ease;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-left: 8px;
            margin-left: 14px;
            border-left: 2px solid transparent;
        }
        #software-submenu.open {
            max-height: 200px;
            border-left-color: #f5cf04;
        }

        .submenu-btn {
            cursor: pointer;
            border: none;
            background-color: transparent;
            color: #aaa;
            width: 100%;
            height: 42px;
            border-radius: 8px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            padding: 0 10px;
            text-align: left;
            transition: background-color 0.2s, color 0.2s;
            font-size: 0.9em;
        }
        .submenu-btn i { font-size:17px; min-width:26px; display:flex; justify-content:center; flex-shrink:0; }
        .submenu-btn span { opacity:0; margin-left:8px; transition:opacity 0.2s ease; pointer-events:none; white-space:nowrap; }
        #sidebar:hover .submenu-btn span { opacity: 1; }
        .submenu-btn:hover { background-color: #f5cf04; color: #111; }
    </style>
</head>
<body>
<div id="sidebar">
    <button id="find">
        <i class="ri-search-line"></i>
        <span>Find</span>
    </button>
    <button id="assests-list">
        <i class="ri-file-list-3-line"></i>
        <span>Assets list</span>
    </button>

    <!-- Software Dropdown -->
    <div id="software-dropdown-wrapper">
        <button id="software-toggle" onclick="toggleSoftwareDropdown()">
            <i class="ri-computer-line"></i>
            <span>Software <i class="ri-arrow-down-s-line" id="software-arrow"></i></span>
        </button>
        <div id="software-submenu">
            <button class="submenu-btn" id="all-softwares">
                <i class="ri-apps-line"></i>
                <span>All Softwares</span>
            </button>
            <button class="submenu-btn" id="license-agreements">
                <i class="ri-file-shield-2-line"></i>
                <span>License Agreements</span>
            </button>
        </div>
    </div>

    <button id="Register-Asset">
        <i class="ri-registered-line"></i>
        <span>Register Asset</span>
    </button>
    <button id="profilee">
        <i class="ri-user-2-line"></i>
        <span>Profile</span>
    </button>
</div>

<script>
function toggleSoftwareDropdown() {
    const submenu = document.getElementById('software-submenu');
    const arrow   = document.getElementById('software-arrow');
    if (!submenu) return;
    submenu.classList.toggle('open');
    arrow?.classList.toggle('rotated');
}
</script>
</body>
</html>
